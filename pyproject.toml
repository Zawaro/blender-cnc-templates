[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-cnc-templates"
dynamic = ["version"]

[dependency-groups]
lint = ["ruff==0.15.20"]
test = ["pytest", "pytest-blender"]

[tool.setuptools]
packages = ["shared"]

[tool.setuptools.dynamic]
version = { attr = "shared.constants.TEMPLATE_VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:pytest-blender"

[tool.ruff]
indent-width = 2
line-length = 200

[tool.ruff.lint.per-file-ignores]
"*/main.py" = ["E402"]
"*/generate_scripts.py" = ["E402"]
"*/scene_builder.py" = ["E402"]